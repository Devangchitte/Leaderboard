services:
  - type: web
    name: realtime-leaderboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
    disk:
      name: leaderboard-data
      mountPath: /app/data
      sizeGB: 1
